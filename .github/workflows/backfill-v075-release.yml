name: Backfill v0.7.5 GitHub Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/backfill-v075-release.yml"

permissions:
  contents: write

jobs:
  backfill-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v0.7.5

      - name: Build release notes
        run: |
          python - <<'PY'
          import pathlib
          import re

          version = "0.7.5"
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"^## \[{re.escape(version)}\].*?\n(?P<body>.*?)(?=^## \[|\Z)"
          match = re.search(pattern, changelog, flags=re.MULTILINE | re.DOTALL)
          body = match.group("body").strip() if match else "Release v0.7.5."
          pathlib.Path("release-notes.md").write_text(
              f"# ClawSentry v0.7.5\n\n{body}\n",
              encoding="utf-8",
          )
          PY

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.7.5 >/dev/null 2>&1; then
            gh release edit v0.7.5 \
              --title "ClawSentry v0.7.5" \
              --notes-file release-notes.md \
              --latest
          else
            gh release create v0.7.5 \
              --verify-tag \
              --title "ClawSentry v0.7.5" \
              --notes-file release-notes.md \
              --latest
          fi
